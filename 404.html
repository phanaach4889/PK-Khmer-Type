<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PK Khmer Type — Redirecting</title>
  <style>
    body {
      background: #060812;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .wrap {
      max-width: 480px;
      padding: 24px;
    }
    a {
      color: #ff9d2e;
      text-decoration: underline;
    }
  </style>
  <script>
    (function() {
      var rawPath = window.location.pathname;
      var clean = rawPath.toLowerCase().replace(/\/+$/, '');
      if (clean.endsWith('/documents') || clean.endsWith('/docs') || clean.endsWith('/doc')) {
        var base = rawPath.indexOf('/PK-Khmer-Type') !== -1 ? '/PK-Khmer-Type/Documents/index.html' : '/Documents/index.html';
        window.location.replace(base + window.location.search + window.location.hash);
      } else {
        var root = rawPath.indexOf('/PK-Khmer-Type') !== -1 ? '/PK-Khmer-Type/' : '/';
        window.location.replace(root + window.location.search + window.location.hash);
      }
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <h2>Redirecting to PK Khmer Type...</h2>
    <p>If you are not redirected automatically, <a href="./">click here</a>.</p>
  </div>
</body>
</html>
