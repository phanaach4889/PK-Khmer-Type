<!doctype html>
<html lang="en">

    <meta name="theme-color" content="#ff9d2e" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>PK Khmer Type</title>
    <script>
      // ES modules served by Vite cannot be imported from file://. Keep the
      // established offline application available when this file is opened
      // directly, while HTTP development and production builds use React.
      if (location.protocol === 'file:') {
        location.replace(new URL('./public/legacy.html', location.href));
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
