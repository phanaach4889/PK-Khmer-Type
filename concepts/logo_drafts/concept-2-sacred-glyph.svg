<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Radial Atmosphere -->
    <radialGradient id="sacredAura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#e67e22" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>

    <!-- Liquid Metallic Gold Gradient 1 -->
    <linearGradient id="goldRibbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="25%" stop-color="#ffd166"/>
      <stop offset="55%" stop-color="#f39c12"/>
      <stop offset="85%" stop-color="#d35400"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>

    <!-- Liquid Metallic Gold Gradient 2 (Reverse for depth overlap) -->
    <linearGradient id="goldRibbon2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="35%" stop-color="#ffb703"/>
      <stop offset="70%" stop-color="#d48806"/>
      <stop offset="100%" stop-color="#874d00"/>
    </linearGradient>

    <!-- Obsidian Titanium Plate Gradient -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181d2c"/>
      <stop offset="100%" stop-color="#0b0e17"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="ribbonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cast Shadow for 3D Overlap Ribbon Effect -->
    <filter id="ribbonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="512" height="512" rx="120" fill="#080b14"/>
  <circle cx="256" cy="256" r="230" fill="url(#sacredAura)"/>

  <!-- Sleek Geometric Squircle Housing -->
  <rect x="44" y="44" width="424" height="424" rx="92" fill="url(#chassisGrad)" stroke="rgba(255,209,102,0.3)" stroke-width="3"/>
  <rect x="52" y="52" width="408" height="408" rx="84" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Geometric Khmer Kbach Flourish Background Watermark -->
  <g opacity="0.08" stroke="#ffd166" stroke-width="3" fill="none">
    <circle cx="256" cy="256" r="160"/>
    <circle cx="256" cy="256" r="110"/>
    <path d="M96 256 H416 M256 96 V416"/>
    <path d="M142 142 L370 370 M142 370 L370 142"/>
  </g>

  <!-- Interlocking PK & Khmer "ក" (Ka) Sacred Ribbon -->
  <g filter="url(#ribbonShadow)">
    <!-- Base "P" Stem -->
    <path d="M164 360 V156 C164 150 169 146 175 146 H228 C266 146 294 172 294 208 C294 244 266 268 228 268 H184" 
          stroke="url(#goldRibbon1)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#ribbonGlow)"/>

    <!-- Khmer "ក" (Ka) / "ភ" (Pha) Crown Loop weaving over P -->
    <path d="M228 146 C248 116 284 112 308 128 C330 142 338 170 326 196" 
          stroke="url(#goldRibbon2)" stroke-width="20" stroke-linecap="round" fill="none"/>

    <!-- Dynamic Diagonal "K" Arms morphing into Khmer Kbach Tail -->
    <path d="M256 252 L344 152 C352 144 362 148 360 158 L304 228 L368 350 C374 360 364 368 354 364 L260 292" 
          stroke="url(#goldRibbon1)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Tactile Mechanical Stem Crosshair at the Core -->
    <g transform="translate(256, 256)">
      <circle cx="0" cy="0" r="18" fill="#141928" stroke="url(#goldRibbon1)" stroke-width="4"/>
      <path d="M-9 0 H9 M0 -9 V9" stroke="#fff8db" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Floating Golden Spark Energy Particles -->
  <circle cx="164" cy="146" r="5" fill="#fff" filter="url(#ribbonGlow)"/>
  <circle cx="360" cy="154" r="4.5" fill="#ffd166"/>
  <circle cx="356" cy="360" r="5.5" fill="#ffb703" filter="url(#ribbonGlow)"/>
  <circle cx="164" cy="360" r="4" fill="#ffd166"/>

  <!-- Minimal Brand Subline -->
  <text x="256" y="428" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="#fff" text-anchor="middle">
    PK <tspan fill="#ffd166">TYPE</tspan>
  </text>
</svg>

