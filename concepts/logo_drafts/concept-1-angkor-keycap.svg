<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Outer Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#ff9d2e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#070a14" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Squircle Plate Gradient -->
    <linearGradient id="squircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2538"/>
      <stop offset="50%" stop-color="#101524"/>
      <stop offset="100%" stop-color="#080b14"/>
    </linearGradient>

    <!-- Border Gold Rim -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b2"/>
      <stop offset="35%" stop-color="#ffd166"/>
      <stop offset="70%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>

    <!-- Keycap Top Face -->
    <linearGradient id="keyTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a334e"/>
      <stop offset="100%" stop-color="#141a2a"/>
    </linearGradient>

    <!-- Glowing Gold Emissive -->
    <linearGradient id="goldCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffe484"/>
      <stop offset="70%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff9d2e"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Gold Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="18" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="512" height="512" rx="112" fill="#090c16"/>
  <circle cx="256" cy="240" r="220" fill="url(#bgGlow)"/>

  <!-- Outer Beveled Squircle Frame -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="url(#squircleGrad)" stroke="url(#goldRim)" stroke-width="4.5" filter="url(#softShadow)"/>

  <!-- Precision Corner Registration Dots -->
  <circle cx="84" cy="84" r="3.5" fill="#ffd166" opacity="0.6"/>
  <circle cx="428" cy="84" r="3.5" fill="#ffd166" opacity="0.6"/>
  <circle cx="84" cy="428" r="3.5" fill="#ffd166" opacity="0.6"/>
  <circle cx="428" cy="428" r="3.5" fill="#ffd166" opacity="0.6"/>

  <!-- Inner Mechanical Keycap Body (Front-Bevel 3D Effect) -->
  <!-- Keycap Skirt Base -->
  <path d="M104 168 L148 128 H364 L408 168 V372 L368 404 H144 L104 372 Z" fill="#0d111d" stroke="rgba(255,209,102,0.2)" stroke-width="2"/>
  
  <!-- Keycap Upper Dish -->
  <rect x="136" y="128" width="240" height="236" rx="36" fill="url(#keyTopGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <!-- Dish Specular Edge Reflection -->
  <path d="M156 142 H356" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linecap="round"/>

  <!-- Angkor Spire Crown atop the Monogram -->
  <g filter="url(#neonGlow)">
    <!-- Central Tower (Prasat Angkor) -->
    <path d="M256 162 L261 178 H251 Z" fill="url(#goldCore)"/>
    <path d="M256 172 L264 196 H248 Z" fill="url(#goldCore)"/>
    <path d="M253 196 H259 V208 H253 Z" fill="url(#goldCore)"/>

    <!-- Left Flanking Towers -->
    <path d="M232 178 L236 194 H228 Z" fill="url(#goldCore)" opacity="0.85"/>
    <path d="M230 194 H234 V208 H230 Z" fill="url(#goldCore)" opacity="0.85"/>
    <path d="M212 188 L215 200 H209 Z" fill="url(#goldCore)" opacity="0.7"/>

    <!-- Right Flanking Towers -->
    <path d="M280 178 L284 194 H276 Z" fill="url(#goldCore)" opacity="0.85"/>
    <path d="M278 194 H282 V208 H278 Z" fill="url(#goldCore)" opacity="0.85"/>
    <path d="M300 188 L303 200 H297 Z" fill="url(#goldCore)" opacity="0.7"/>

    <!-- Temple Base Foundation Line -->
    <line x1="200" y1="210" x2="312" y2="210" stroke="url(#goldCore)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Sculptural Interlocking PK Monogram -->
    <!-- "P" Glyph with Khmer curved flourish -->
    <path d="M188 324 V226 H228 C248 226 262 238 262 256 C262 274 248 284 228 284 H188" 
          stroke="url(#goldCore)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- "K" Glyph interwoven seamlessly with Khmer Kbach terminal -->
    <path d="M268 226 V324" stroke="url(#goldCore)" stroke-width="14" stroke-linecap="round"/>
    <path d="M332 226 L272 276 L334 324" stroke="url(#goldCore)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Khmer "ក" (Ka) Subtle Home Row Accent loop -->
    <path d="M208 302 Q 224 290 240 302 Q 256 314 272 302" stroke="#fff2b2" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75"/>
  </g>

  <!-- Keyboard Home Row Tactile Ridge / Stabilizer Line -->
  <line x1="220" y1="344" x2="292" y2="344" stroke="url(#goldRim)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Subtitle Brand Typographic Seal -->
  <text x="256" y="432" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="19" font-weight="700" letter-spacing="6" fill="#ffd166" text-anchor="middle" opacity="0.95">KHMER TYPE</text>
</svg>

