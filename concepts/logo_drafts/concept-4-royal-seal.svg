<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Radial Sunburst Core -->
    <radialGradient id="sunburstCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#b8860b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#05070e" stop-opacity="0"/>
    </radialGradient>

    <!-- Royal Gold Gradient -->
    <linearGradient id="royalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fff2b2"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="80%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>

    <!-- Deep Lapis Obsidian Core -->
    <radialGradient id="lapisCore" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#19233c"/>
      <stop offset="70%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#060911"/>
    </radialGradient>

    <!-- Drop Shadow for Seal -->
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <!-- Gold Glow Filter -->
    <filter id="royalGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Canvas Base -->
  <rect width="512" height="512" rx="120" fill="#060810"/>
  <circle cx="256" cy="256" r="230" fill="url(#sunburstCore)"/>

  <!-- Main Circular Medallion Disc -->
  <g filter="url(#sealShadow)">
    <circle cx="256" cy="256" r="216" fill="url(#lapisCore)" stroke="url(#royalGold)" stroke-width="4.5"/>
    <circle cx="256" cy="256" r="204" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="256" cy="256" r="196" fill="none" stroke="url(#royalGold)" stroke-width="2" stroke-dasharray="6 6"/>
  </g>

  <!-- 12-Point Radial Keyboard Key Matrix Rays -->
  <g stroke="rgba(255,209,102,0.12)" stroke-width="1.5">
    <line x1="256" y1="60" x2="256" y2="452"/>
    <line x1="60" y1="256" x2="452" y2="256"/>
    <line x1="117" y1="117" x2="395" y2="395"/>
    <line x1="117" y1="395" x2="395" y2="117"/>
  </g>

  <!-- Center Hexagonal Keycap Chassis -->
  <polygon points="256,128 356,186 356,302 256,360 156,302 156,186" 
           fill="#101726" stroke="url(#royalGold)" stroke-width="3" filter="url(#sealShadow)"/>
  
  <polygon points="256,138 346,192 346,296 256,348 166,296 166,192" 
           fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Center Heroic Sculptural Monogram "PK" with Angkorian Spires -->
  <g filter="url(#royalGlow)">
    <!-- Central Angkor Wat Trident Crown atop P & K -->
    <path d="M256 150 L260 166 H252 Z" fill="url(#royalGold)"/>
    <path d="M242 160 L245 174 H239 Z" fill="url(#royalGold)" opacity="0.8"/>
    <path d="M270 160 L273 174 H267 Z" fill="url(#royalGold)" opacity="0.8"/>
    <line x1="230" y1="176" x2="282" y2="176" stroke="url(#royalGold)" stroke-width="2" stroke-linecap="round"/>

    <!-- P Letterform -->
    <path d="M204 316 V196 H236 C256 196 268 206 268 222 C268 238 256 248 236 248 H204" 
          stroke="url(#royalGold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- K Letterform -->
    <path d="M268 196 V316" stroke="url(#royalGold)" stroke-width="12" stroke-linecap="round"/>
    <path d="M318 196 L272 248 L320 316" stroke="url(#royalGold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Center Jewel Node -->
    <circle cx="270" cy="248" r="4.5" fill="#fff"/>
  </g>

  <!-- Circular Outer Inscription Arc (Using Curved Path) -->
  <path id="textArcTop" d="M 88,256 A 168,168 0 0,1 424,256" fill="none"/>
  <path id="textArcBottom" d="M 424,256 A 168,168 0 0,1 88,256" fill="none"/>

  <text font-family="'Space Grotesk', -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="7" fill="url(#royalGold)">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      PK KHMER TYPE
    </textPath>
  </text>

  <text font-family="'Noto Sans Khmer', sans-serif" font-size="14" font-weight="700" letter-spacing="5" fill="#ffd166">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      ក្តារចុចខ្មែរ ភីខេ
    </textPath>
  </text>

  <!-- Decorative Orbiting Jewels at 3 & 9 o'clock -->
  <circle cx="88" cy="256" r="4" fill="#ffd166"/>
  <circle cx="424" cy="256" r="4" fill="#ffd166"/>
</svg>

