<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- D4.3: Two-Tone Hardware Contrast (Titanium White + Temple Gold) -->
  <rect width="128" height="128" rx="28" fill="#080b14"/>
  <rect x="2" y="2" width="124" height="124" rx="26" stroke="#182236" stroke-width="2"/>

  <!-- Keycap Inset Well -->
  <rect x="16" y="16" width="96" height="96" rx="18" fill="#0e1322" stroke="#1f2c46" stroke-width="1.5"/>

  <!-- Corner Brackets in Crisp Titanium White -->
  <path d="M26 36 V26 H36" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M102 36 V26 H92" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M26 92 V102 H36" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M102 92 V102 H92" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- P Component (Pure Titanium Platinum) -->
  <rect x="38" y="34" width="9" height="60" rx="4.5" fill="#f8fafc"/>
  <path d="M47 34 H62 C71 34 78 41 78 50 C78 59 71 66 62 66 H47" 
        stroke="#f8fafc" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- K Component (Vibrant Temple Gold, High Voltage Contrast) -->
  <path d="M60 62 L85 36" stroke="#ffd166" stroke-width="9.5" stroke-linecap="round"/>
  <path d="M60 62 L86 94" stroke="#ffd166" stroke-width="9.5" stroke-linecap="round"/>

  <!-- Subtle Gold Anchor Center Pin -->
  <circle cx="60" cy="62" r="3.5" fill="#ffd166"/>
</svg>

