<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- D.3: Solid Stencil Switch Stem — Premium Metal Hardware Badge -->
  <!-- Deep Matte Slate Background -->
  <rect width="128" height="128" rx="28" fill="#0b0e18"/>
  <rect x="2" y="2" width="124" height="124" rx="26" stroke="#1d2538" stroke-width="2"/>

  <!-- Switch Circular Well -->
  <circle cx="64" cy="64" r="46" fill="#121828" stroke="rgba(255,209,102,0.12)" stroke-width="1.5"/>

  <!-- Solid Gold MX Cross Stem (The Universal Mechanical Switch Icon) -->
  <!-- Formed as a single solid gold shape -->
  <path d="M50 26 H78 V48 H102 V76 H78 V102 H50 V76 H26 V48 H50 Z" 
        fill="#ffd166" rx="4"/>

  <!-- Negative Space "P" and "K" Stencil Cutouts (Crisp, High Contrast, Zero Goofiness) -->
  <!-- Left: P Cutout -->
  <g fill="#0b0e18">
    <!-- P stem & inner counter -->
    <rect x="36" y="52" width="6" height="24" rx="1"/>
    <path d="M42 52 H54 C58 52 61 55 61 59 C61 63 58 66 54 66 H42 V52 Z M47 56 V62 H53 C55 62 56 61 56 59 C56 57 55 56 53 56 H47 Z"/>
  </g>

  <!-- Right: K Cutout -->
  <g fill="#0b0e18">
    <!-- K stem and angled chevron arms -->
    <rect x="67" y="52" width="6" height="24" rx="1"/>
    <path d="M84 52 L73 63 L85 76 H77 L69 67 V64 L77 52 H84 Z"/>
  </g>

  <!-- Center Tactile Pin Dot -->
  <circle cx="64" cy="64" r="2.5" fill="#ffd166"/>
</svg>

