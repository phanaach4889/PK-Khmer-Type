name: Deploy PK Khmer Type to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  validate:
    name: Code & Test Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax
        run: |
          echo "Checking JavaScript files for syntax errors..."
          for file in js/*.js; do
            node --check "$file"
          done
          echo "All core JS files passed syntax validation."

      - name: Validate Curriculum Integrity
        run: |
          node scripts/validate_curriculum.js

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build and stage static web assets
        run: |
          mkdir -p _site
          # Copy core web application and SEO/AI visibility assets into staging directory
          cp index.html manifest.json logo.svg robots.txt sitemap.xml llms.txt .nojekyll _site/
          cp icon-*.png _site/
          cp -r css js data Documents docs assets _site/
          
          # Copy optional documentation if present
          [ -f README.md ] && cp README.md _site/
          [ -f khmer_writing_system_reference.md ] && cp khmer_writing_system_reference.md _site/
          
          echo "Staged site contents:"
          ls -la _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
